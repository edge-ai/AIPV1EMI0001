##################################################################################################
#
# Pipeline to create a package for the AIPV1EMI0001 AiProcessor (YOLOv7-tiny detector)
#
###################################################################################################

name: "CI/CD to build the AiProcessor 📦"

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
    paths-ignore:
      - '**.md'
      - .github/workflows/release.yml
  workflow_dispatch:

# Cancel a superseded run when the same tag is re-pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  JETPACK_VERSION: 36.3.0
  # DeepStream 7.0 Jetson Triton SDK image (ARM64), pinned for parser ABI compatibility.
  PARSER_BUILD_IMAGE: nvcr.io/nvidia/deepstream@sha256:3579dec5816b1df3d327f8b8c62b0cc55579ba912a32f919d3942c99edfdb9cd

jobs:
  release:
    name: Release
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: write  # create the GitHub release and upload assets
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check notebook safeguards
        run: python3 -m unittest discover -s tests

      - name: Set up Node.js for dashboard checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check dashboard integration
        run: node --test tests/dashboard.test.cjs

      - name: Download model weights from Hugging Face
        run: |
          HF_BASE="https://huggingface.co/Edgematrix-JP/AIPV1EMI0001/resolve/main"
          MODEL_DIR="models/AIPV1EMI0001_Yolo_Detector"
          mkdir -p "$MODEL_DIR/1"
          curl -fL "$HF_BASE/yolov7-fp16-1x8x8-jp6-l4t36.3-arm64.engine" -o "$MODEL_DIR/1/yolov7-fp16-1x8x8.engine"
          echo "670150b495a0f120d178fbbb1e3f29758ccbee710e4477bf6847f46517a873b8  $MODEL_DIR/1/yolov7-fp16-1x8x8.engine" | sha256sum -c -

      - name: Build ARM64 custom parser
        run: |
          docker run --rm --platform linux/arm64 --entrypoint bash \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" -w /workspace/bin \
            -e SKIP_ENGINE=1 "$PARSER_BUILD_IMAGE" -eo pipefail ./build.sh
          file models/AIPV1EMI0001_Yolo_Detector/libnvds_infercustomparser.so | grep 'ARM aarch64'

      - name: Set version
        id: version
        run: |
          UNIQUE_ID=$(jq -r '.unique_id' manifest.json)
          VERSION=${GITHUB_REF#refs/tags/}
          # workflow_dispatch runs on a branch, not a tag: fall back to manifest version
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="v$(jq -r '.version' manifest.json)"
          fi
          if [ "$VERSION" != "v$(jq -r '.version' manifest.json)" ]; then
            echo "::error::release tag does not match manifest.json version"; exit 1
          fi
          ARCH="arm64"
          TARGET="all"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "filename=$UNIQUE_ID-$VERSION-$JETPACK_VERSION-$ARCH-$TARGET" >> "$GITHUB_OUTPUT"

      # This public SDK image lacks the station-only eais-tools package.
      # CI assembly is a fallback, not an execution of the EAIS builder.
      # The notebook tests the real EAIS build/export on the station.
      - name: Assemble distribution
        run: |
          set -e
          rm -rf dist
          mkdir -p dist/configs dist/models dist/resources
          cp ./*.md LICENSE callback.py manifest.json dist/
          cp resources/logo.png dist/resources/
          if [ -f options.json ]; then cp options.json dist/; fi
          # Keep only the configs referenced by manifest.json config_plan entries
          # (fails below in validation if one is missing)
          for cfg in $(jq -r '.. | objects | .config_plan? // empty' manifest.json); do
            [ -f "configs/$cfg" ] || { echo "::error::missing config: $cfg"; exit 1; }
            cp "configs/$cfg" dist/configs/
          done
          # Match EAIS's model-root whitelist; version 1 is copied unfiltered.
          MODEL_DIR="models/AIPV1EMI0001_Yolo_Detector"
          mkdir -p "dist/$MODEL_DIR"
          find "$MODEL_DIR" -maxdepth 1 -type f \
            \( -iname '*.txt' -o -iname '*.pbtxt' -o -iname '*.so' -o -iname '*.bin' \) \
            -exec cp {} "dist/$MODEL_DIR/" \;
          cp -r "$MODEL_DIR/1" "dist/$MODEL_DIR/"
          # Copy optional runtime integrations listed by eais-tools' .include
          # convention. Dependencies and credentials are deployment-local.
          while IFS= read -r include_path; do
            case "$include_path" in
              ""|\#*) continue ;;
            esac
            [ -f "$include_path" ] || { echo "::error::.include requires explicit existing files: $include_path"; exit 1; }
            cp --parents "$include_path" dist/
          done < .include

      - name: Validate distribution contents
        run: |
          set -e
          ENGINE="dist/models/AIPV1EMI0001_Yolo_Detector/1/yolov7-fp16-1x8x8.engine"
          PARSER="dist/models/AIPV1EMI0001_Yolo_Detector/libnvds_infercustomparser.so"
          for f in "$ENGINE" "$PARSER" dist/manifest.json dist/callback.py dist/LICENSE dist/LICENSE.weights \
            dist/configs/config_infer_primary_detector_yolov7.txt \
            dist/configs/config_tracker_NvDCF_perf.yml \
            dist/logic/flows.json dist/logic/package.json \
            dist/dashboard/package.json \
            dist/dashboard/aipv1emi0001_dash/src/index.html \
            dist/dashboard/aipv1emi0001_dash/src/index.js \
            dist/dashboard/aipv1emi0001_dash/src/index.css; do
            [ -s "$f" ] || { echo "::error::missing or empty file in dist: $f"; exit 1; }
          done
          if [ -e dist/logic/flows_cred.json ]; then
            echo "::error::credentials file leaked into dist"; exit 1
          fi
          if find dist -type d -name node_modules -print -quit | grep -q .; then
            echo "::error::node_modules leaked into dist"; exit 1
          fi
          # No source artifacts may ship
          if find dist -name '*.onnx' -o -name '*.pt' -o -name '*.cfg' -o -name '*.cpp' -o -name 'Makefile' | grep .; then
            echo "::error::source files leaked into dist"; exit 1
          fi
          python3 tools/check_package.py

      - name: Make tarball
        run: |
          tar -zcf "${{ steps.version.outputs.filename }}.tar.gz" dist
          python3 tools/check_package.py --archive "${{ steps.version.outputs.filename }}.tar.gz"
          sha256sum "${{ steps.version.outputs.filename }}.tar.gz" > "${{ steps.version.outputs.filename }}.tar.gz.sha256"

      - name: Save validated package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.filename }}
          path: |
            ${{ steps.version.outputs.filename }}.tar.gz
            ${{ steps.version.outputs.filename }}.tar.gz.sha256

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          files: |
            ${{ steps.version.outputs.filename }}.tar.gz
            ${{ steps.version.outputs.filename }}.tar.gz.sha256
          generate_release_notes: true
